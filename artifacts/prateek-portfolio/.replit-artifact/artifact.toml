kind = "web"
previewPath = "/"
title = "Prateek Upadhyay — Portfolio"
description = "A modern, resume-driven portfolio for Prateek Upadhyay, a Test Automation Engineer specializing in automotive systems, OTA validation, embedded software, and robust test infrastructure."
version = "1.0.0"
id = "artifacts/prateek-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21844

[services.development]
run = "pnpm --filter @workspace/prateek-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prateek-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/prateek-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21844"
BASE_PATH = "/"
